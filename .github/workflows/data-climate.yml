name: Data climate
# Météo-France republishes Climadiag Commune a few times a year under a new file name
# (v401 in July 2026, v411 in September 2026): check monthly, and open a PR to review the diff
# before it goes live. No change, no PR (the files carry the version date, not a run date).
on:
  schedule:
    - cron: '0 6 5 * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: data-climate
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/climate.mjs
      - run: npm test
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/data/climate
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          branch="data/climate-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -m "Update climate data (Météo-France)"
          git push -u origin "$branch"
          gh pr create --title "Future climate: Météo-France data of $(date -u +%Y-%m-%d)" \
            --body "Automatic update of public/data/climate by scripts/climate.mjs (Climadiag Commune, TRACC-2023 Explore2)."

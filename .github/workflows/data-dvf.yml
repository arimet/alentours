name: Data DVF
# Rebuilds public/data/dvf/ from the latest geo-dvf release and proposes it as a pull request.
# DVF is published twice a year; a monthly run catches a release within a month, and opens no PR when nothing changed.
on:
  schedule:
    - cron: '0 4 3 * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: data-dvf
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/dvf.mjs
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: data/dvf
          commit-message: 'DVF data: update yearly medians'
          title: 'DVF data: update yearly medians'
          body: 'Generated by `scripts/dvf.mjs` from https://files.data.gouv.fr/geo-dvf/latest/csv/ (Data DVF workflow).'
          add-paths: public/data/dvf
          delete-branch: true

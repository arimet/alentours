name: Data risks
on:
  schedule:
    - cron: '0 5 3 * *' # the 3rd of each month
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/risks.mjs
      - run: npm test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data/risks
          commit-message: 'data(risks): update GASPAR and radon commune files'
          title: 'Risks data: monthly update (GASPAR, radon)'
          body: 'Files in `public/data/risks/` regenerated by `scripts/risks.mjs` from the GASPAR database and the radon potential (data.gouv).'
          add-paths: public/data/risks
          delete-branch: true
